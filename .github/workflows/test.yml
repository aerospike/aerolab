name: Tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + mock tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache-dependency-path: go.sum
      - name: Set up Node
        # The webui build (part of `go generate`) needs Node/npm.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/webui/package-lock.json
      - name: Run unit + mock tests
        # The module root is the repo root; ./... covers cli/ and pkg/.
        # `make test` runs `go generate` first: most //go:embed inputs are
        # committed, but expiry.linux.amd64.zip is not, and make builds with
        # -tags=embedexpiry which requires it.
        # Integration tests are behind build tags and excluded here.
        run: make test

  lint:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache-dependency-path: go.sum
      - name: go vet
        # Runs without -tags=embedexpiry, i.e. it vets the exact configuration
        # library consumers get via `go get` (expiry stub + committed embed
        # assets). No generate step needed: the only non-committed embed input
        # (expiry.linux.amd64.zip) is behind the embedexpiry build tag, and the
        # tagged configuration is compiled by `make test` in the unit job.
        env:
          GOWORK: off
          GOFLAGS: -mod=vendor
        run: go vet ./...

  docker-integration:
    name: Docker integration tests
    runs-on: ubuntu-latest
    # These tests need a real Docker daemon and hit external download endpoints,
    # so they are heavy/slow. Do not run them on every PR; run on pushes to the
    # default branch and on manual dispatch. Promote to a required PR check once
    # the ported e2e Docker suite is stable.
    if: github.event_name != 'pull_request'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache-dependency-path: go.sum
      - name: Set up Node
        # The webui build (part of `go generate`) needs Node/npm.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/webui/package-lock.json
      - name: Run docker integration tests
        # `make test-docker` runs `go generate` first to produce the //go:embed
        # inputs required for the packages to compile.
        run: make test-docker
